name: freef1_cockpit
description: FreeF1 Cockpit desktop app for the authorized Formula 1 Xtream feed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.3.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  window_manager: ^0.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
