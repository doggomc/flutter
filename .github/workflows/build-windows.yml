name: Build FreeF1 Cockpit (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate FreeF1 Flutter project
        id: project
        shell: pwsh
        run: |
          $candidates = @(
            @{ Directory = '.'; Manifest = (Join-Path $env:GITHUB_WORKSPACE 'pubspec.yaml') },
            @{ Directory = 'freef1_cockpit_flutter'; Manifest = (Join-Path $env:GITHUB_WORKSPACE 'freef1_cockpit_flutter\pubspec.yaml') }
          )
          $projectDirectory = $null
          foreach ($candidate in $candidates) {
            if (-not (Test-Path $candidate.Manifest)) { continue }
            $manifest = Get-Content $candidate.Manifest -Raw
            if ($manifest -match '(?m)^name:\s*freef1_cockpit\s*$') {
              $projectDirectory = $candidate.Directory
              break
            }
          }
          if ($null -eq $projectDirectory) {
            throw 'Could not find the FreeF1 pubspec.yaml at the repository root or in freef1_cockpit_flutter/. Make sure the project files were copied into the repository.'
          }
          "directory=$projectDirectory" >> $env:GITHUB_OUTPUT
          Write-Host "Using FreeF1 project directory: $projectDirectory"

      - name: Verify portal build secrets
        shell: pwsh
        env:
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PORTAL_USERNAME)) { throw 'Add PORTAL_USERNAME in repository Actions secrets.' }
          if ([string]::IsNullOrWhiteSpace($env:PORTAL_PASSWORD)) { throw 'Add PORTAL_PASSWORD in repository Actions secrets.' }

      - name: Generate the Windows runner
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter create --platforms=windows --project-name freef1_cockpit .

      - name: Remove generated Flutter counter test
        shell: pwsh
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          $sampleTest = 'test/widget_test.dart'
          if (Test-Path $sampleTest) {
            $contents = Get-Content $sampleTest -Raw
            if ($contents.Contains('Counter increments smoke test') -and $contents.Contains('MyApp')) {
              Remove-Item $sampleTest
            }
          }

      - name: Resolve Flutter packages
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter analyze

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: flutter build windows --release "--dart-define=PORTAL_USERNAME=$env:PORTAL_USERNAME" "--dart-define=PORTAL_PASSWORD=$env:PORTAL_PASSWORD"

      - name: Upload the complete runnable app folder
        uses: actions/upload-artifact@v7
        with:
          name: FreeF1-Cockpit-Windows-x64
          path: ${{ steps.project.outputs.directory }}/build/windows/x64/runner/Release/
          if-no-files-found: error
          compression-level: 0
