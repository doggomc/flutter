name: Build FreeF1 Cockpit (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freef1-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Locate FreeF1 Flutter project
        id: project
        shell: pwsh
        run: |
          $candidates = @(
            @{ Directory = '.'; Manifest = (Join-Path $env:GITHUB_WORKSPACE 'pubspec.yaml') },
            @{ Directory = 'freef1_cockpit_flutter'; Manifest = (Join-Path $env:GITHUB_WORKSPACE 'freef1_cockpit_flutter\pubspec.yaml') }
          )
          $projectDirectory = $null
          foreach ($candidate in $candidates) {
            if (-not (Test-Path $candidate.Manifest)) { continue }
            $manifest = Get-Content $candidate.Manifest -Raw
            if ($manifest -match '(?m)^name:\s*freef1_cockpit\s*$') {
              $projectDirectory = $candidate.Directory
              break
            }
          }
          if ($null -eq $projectDirectory) {
            throw 'Could not find the FreeF1 pubspec.yaml at the repository root or in freef1_cockpit_flutter/. Copy the project files from the source ZIP and keep the workflow at repository-root .github/workflows/.'
          }
          "directory=$projectDirectory" >> $env:GITHUB_OUTPUT
          Write-Host "Using FreeF1 project directory: $projectDirectory"

      - name: Prepare project and remove misplaced workflow file
        shell: pwsh
        working-directory: ${{ steps.project.outputs.directory }}
        run: pwsh -NoProfile -File scripts/prepare_project.ps1

      - name: Configure Dart package cache
        id: pub-cache
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:RUNNER_TEMP 'pub-cache'
          New-Item -ItemType Directory -Force -Path $cachePath | Out-Null
          "path=$cachePath" >> $env:GITHUB_OUTPUT
          "PUB_CACHE=$cachePath" >> $env:GITHUB_ENV

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pub-cache.outputs.path }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Windows runner when needed
        shell: pwsh
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          if (Test-Path 'windows/CMakeLists.txt') {
            Write-Host 'Windows runner already exists; skipping flutter create.'
          } else {
            flutter create --platforms=windows --project-name freef1_cockpit --no-pub .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Remove generated Flutter counter test
        shell: pwsh
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          $sampleTest = 'test/widget_test.dart'
          if (Test-Path $sampleTest) {
            $contents = Get-Content $sampleTest -Raw
            if ($contents.Contains('Counter increments smoke test') -and $contents.Contains('MyApp')) {
              Remove-Item $sampleTest -Force
            }
          }

      - name: Resolve Flutter packages
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter analyze

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter test

      - name: Build Windows release
        working-directory: ${{ steps.project.outputs.directory }}
        run: flutter build windows --release

      - name: Upload the complete runnable app folder
        uses: actions/upload-artifact@v7
        with:
          name: FreeF1-Cockpit-Windows-x64
          path: ${{ steps.project.outputs.directory }}/build/windows/x64/runner/Release/
          if-no-files-found: error
          compression-level: 0
